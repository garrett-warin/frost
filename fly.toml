app = "frost-browsing"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  PUBLIC_ORIGIN = "https://frost-browsing.fly.dev"
  FROST_EDGE_ORIGIN = "https://d18pizaz65wabf.cloudfront.net"
  FROST_EDGE_ORIGINS = "https://du88h8kerz0cp.cloudfront.net,https://d3e3kj3ww0e0eh.cloudfront.net,https://djknofmmxg2b9.cloudfront.net,https://d3qqn7jtiigd7i.cloudfront.net,https://d2q31xn8fcj0tg.cloudfront.net,https://d2ho3tfmm3mv7m.cloudfront.net,https://d19xfihozfhn60.cloudfront.net,https://dl3blvmdwt77i.cloudfront.net,https://d1tfvvgz2yj2k5.cloudfront.net,https://d25iw9gptmkr1e.cloudfront.net,https://d2srxc54b294vy.cloudfront.net,https://d3kkjy11sjy54y.cloudfront.net,https://d26biuvj6blvsp.cloudfront.net,https://dlktq12hsc86y.cloudfront.net"
  FROST_PRESENCE_MACHINE = "683e3d9ae17238"
  FROST_ADMIN_ORIGIN = "https://d2ftxdtd3x015d.cloudfront.net"
  FROST_DISPENSER_ORIGIN = "https://d3mbml114oiqni.cloudfront.net"
  FROST_AI_PROVIDER = "groq"
  FROST_AI_MODELS = "openai/gpt-oss-20b,openai/gpt-oss-120b,qwen/qwen3.8-27b"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"
    [http_service.checks.headers]
      Host = "frost-browsing.fly.dev"
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[restart]]
  policy = "always"


